name: Publish embed-theme package

# Same mechanism as publish.yml (@basicbar/ui): `npm pack`, tarball attached to
# a GitHub Release as a plain public URL, no npm registry or token needed.
# Only embed-theme/v* tags trigger this. The release stays a draft until a
# human publishes it (`gh release edit embed-theme/vX.Y.Z --draft=false`);
# the asset URL in the tools' package.json works only after that.

on:
  push:
    tags:
      - "embed-theme/v*"

permissions:
  contents: write

jobs:
  embed-theme-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify tag matches package.json version
        run: |
          VERSION="${GITHUB_REF_NAME#embed-theme/v}"
          PKG_VERSION="$(node -p "require('./packages/embed-theme/package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME ≠ package.json-Version $PKG_VERSION"; exit 1
          fi

      - run: cd packages/embed-theme && npm ci --no-fund --no-audit
      - run: cd packages/embed-theme && npm test
      - run: cd packages/embed-theme && npm pack

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/embed-theme/basicbar-embed-theme-*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
