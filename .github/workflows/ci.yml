name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spdx-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX headers
        run: |
          fehlend=$(find packages template -type f ! -empty \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.css' -o -name '*.js' -o -name '*.mjs' \) \
            ! -path '*/node_modules/*' ! -path '*/migrations/*' ! -path '*/dist/*' \
            -exec grep -L 'SPDX-License-Identifier: Apache-2.0' {} +) || true
          if [ -n "$fehlend" ]; then
            echo "Dateien ohne SPDX-Header:"
            echo "$fehlend"
            exit 1
          fi
          echo "SPDX-Header vollständig."

  django-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [integrations, auth, lti, pdf]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/django/basicbar-${{ matrix.package }}/pyproject.toml
      # `[test]` pulls test-only dependencies where a package declares them (pdf: pypdf).
      - run: pip install --quiet "./packages/django/basicbar-${{ matrix.package }}[test]"
      - run: cd packages/django/basicbar-${{ matrix.package }} && python runtests.py

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - run: cd packages/ui && npm ci --no-fund --no-audit
      - run: cd packages/ui && npm run build
      - run: cd packages/ui && npx tsc --noEmit

  # @basicbar/embed-theme: contrast checker and Tailwind 3/4 build tests, then a
  # look into the tarball (nothing from test/, everything the exports need).
  embed-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/embed-theme/package-lock.json
      - run: cd packages/embed-theme && npm ci --no-fund --no-audit
      - run: cd packages/embed-theme && npm test
      - name: Pack and check the file list
        run: |
          cd packages/embed-theme
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].files.map((f) => f.path);
            const need = ["theme.css", "tailwind.js", "lib/contrast.mjs", "bin/check-theme.mjs",
              "template/theme.css", "fonts/signika-latin-wght-normal.woff2", "fonts/OFL.txt", "LICENSE"];
            const missing = need.filter((f) => !files.includes(f));
            const stray = files.filter((f) => f.startsWith("test/"));
            if (missing.length || stray.length) {
              console.error("fehlt im Paket:", missing, "unerwartet im Paket:", stray);
              process.exit(1);
            }
            console.log("Paketliste ok:", files.length, "Dateien");
          ' "$RUNNER_TEMP/pack.json"

  # Renders the Copier template with defaults (LTI on, so every conditional
  # branch is exercised) and runs the generated tool's lint, checks, test suite
  # and frontend build — catches Jinja errors, stale package pins and broken
  # settings before the next real tool does.
  template-probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: probe
          POSTGRES_USER: probe
          POSTGRES_PASSWORD: probe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U probe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: probe
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Render template
        run: >-
          pipx run copier copy --trust --defaults --vcs-ref HEAD
          --data project_slug=probe --data use_lti=true --data ci_host=github
          . /tmp/probe
      - name: Backend lint, checks, tests
        run: |
          cd /tmp/probe/backend
          pip install --quiet -r requirements.txt ruff
          ruff check .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Frontend build
        run: cd /tmp/probe/frontend && npm install --no-fund --no-audit && npm run build
