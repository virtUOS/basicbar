# Dependabot version updates. Security updates are switched on separately in
# the repo settings and do not depend on this file. Every Dependabot PR runs
# the normal CI (ci.yml triggers on pull_request); a human merges, as always.
#
# Not covered, on purpose:
# - The template's pins (requirements.txt.jinja, package.json.jinja) are Jinja
#   files Dependabot cannot parse; they are bumped by hand with each package
#   release, and the template-probe CI job catches stale ones.
# - The template's Docker base images (python:3.12-slim, node:22-slim) are
#   runtime decisions for every future tool, not routine bumps, and the
#   frontend Dockerfile is a .jinja file Dependabot would leave behind.
# - The Django packages (pip). They are libraries with lower bounds only; the
#   tools pin the real versions. For pip Dependabot offers no "widen" (only
#   lockfile-only, auto, increase, increase-if-necessary), and "auto" treats
#   packages that are not on PyPI as apps — every strategy would raise the
#   floors (Django>=5.1 → >=6.0) and force each tool to upgrade. Security
#   updates still run for them via the repo settings.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # @basicbar/ui. In-range updates only refresh package-lock.json (the
  # published ranges stay as they are for the tools); a new major moves the
  # range. TipTap packages must stay on one version, so they always travel
  # together in their own PR.
  - package-ecosystem: npm
    directory: /packages/ui
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    versioning-strategy: increase-if-necessary
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      # React and its types must move together (react-dom needs the same
      # version as react; @types/* follow the major). Without the group,
      # Dependabot split them (see docs/UPGRADE-2026-11-STACK.md, React).
      # The template's React pins (package.json.jinja) are not covered, see
      # above; they are raised with the next template release.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Without the exclude, Dependabot put the TipTap minor updates into this
      # group instead of "tiptap" (first run, PR #34), despite the order.
      npm-minor-and-patch:
        update-types: [minor, patch]
        # Same reason as for TipTap: otherwise React minors land here.
        exclude-patterns:
          - "@tiptap/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # TypeScript 7 has no compiler API; tsup's .d.ts build (rollup-plugin-dts)
      # needs it and fails, also with the @typescript/typescript6 fallback
      # (tested 2026-11-19, tsup 9.0.0). Remove once tsup supports TS 7.
      - dependency-name: typescript
        versions: [">=7"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # @basicbar/embed-theme. Tailwind 3 and 4 are dev dependencies under npm
  # aliases (tailwindcss3, tailwindcss4) for the build tests; their majors are
  # the whole point of having both, so they stay where they are. Minor and
  # patch updates still come in.
  - package-ecosystem: npm
    directory: /packages/embed-theme
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: tailwindcss3
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss4
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
