stages:
  - check
  - test
  - publish

# Jede Quelldatei trägt einen SPDX-Header (siehe README, Konventionen).
# Paket-Tests und npm-Publish kommen mit den Paketen dazu (Phasen 2/3).
spdx-header:
  stage: check
  image: alpine:3.20
  script:
    - |
      fehlend=$(find packages template -type f \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.css' \) \
        ! -path '*/node_modules/*' ! -path '*/migrations/*' \
        -exec grep -L 'SPDX-License-Identifier: Apache-2.0' {} +) || true
      if [ -n "$fehlend" ]; then
        echo "Dateien ohne SPDX-Header:"
        echo "$fehlend"
        exit 1
      fi
      echo "SPDX-Header vollständig."

integrations-tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --quiet ./packages/django/basicbar-integrations
    - cd packages/django/basicbar-integrations && python runtests.py

ui-build:
  stage: test
  image: node:22-slim
  script:
    - cd packages/ui
    - npm ci --no-fund --no-audit
    - npm run build
    - npx tsc --noEmit

# Beim Taggen von ui/vX.Y.Z: Tarball bauen und in die Generic Package Registry
# laden. Öffentliches Projekt → die Tools installieren die Tarball-URL ohne
# Token (npm-Dependency auf die URL, siehe ADR-0002).
ui-publish:
  stage: publish
  image: node:22-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^ui\/v/'
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    - cd packages/ui
    - VERSION="${CI_COMMIT_TAG#ui/v}"
    - PKG_VERSION="$(node -p "require('./package.json').version")"
    - |
      if [ "$VERSION" != "$PKG_VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG ≠ package.json-Version $PKG_VERSION"; exit 1
      fi
    - npm ci --no-fund --no-audit
    - npm pack
    - >-
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "basicbar-ui-$VERSION.tgz"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ui/$VERSION/basicbar-ui-$VERSION.tgz"
