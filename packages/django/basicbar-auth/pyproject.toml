[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "basicbar-auth"
version = "0.1.1"
description = "OIDC-Fundament der virtUOS -bar-Tools: Backend, Silent Login, Back-Channel-Logout, Discovery, AbstractBasicUser, optionale Account-Limits"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Universität Osnabrück (virtUOS)" }]
dependencies = [
    "Django>=5.1",
    "mozilla-django-oidc>=4.0",
]

[tool.setuptools.packages.find]
include = ["basicbar_auth*"]
