[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "basicbar-pdf"
version = "0.1.0"
description = "PDF-Rahmen der virtUOS -bar-Tools: reportlab-Dokument mit mitgelieferter Schrift, Fußzeile, Editor-HTML"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Universität Osnabrück (virtUOS)" }]
dependencies = [
    "reportlab>=4.4,<6",
]

[project.optional-dependencies]
test = ["pypdf>=6"]

[tool.setuptools.packages.find]
include = ["basicbar_pdf*"]

[tool.setuptools.package-data]
basicbar_pdf = ["fonts/*.ttf", "fonts/OFL.txt"]
